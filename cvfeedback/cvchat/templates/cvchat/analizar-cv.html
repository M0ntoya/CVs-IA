{% extends 'cvchat/base.html' %}
{% block title %}Analizar CV{% endblock %}

{% block content %}
<div class="form-box">
  <div class="avatar">
    <i class="fas fa-file-pdf"></i>
  </div>
  <h2>Sube tu CV (PDF)</h2>
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <div class="input-container">
      <input type="file" id="cvFile" name="cv" accept="application/pdf" required />
      <label for="cvFile">Seleccionar archivo PDF</label>
      <div class="file-name" id="fileName">Ningún archivo seleccionado</div>
    </div>
    <button type="submit">Enviar</button>
  </form>

  {% if feedback %}
    <h3>Feedback recibido:</h3>
    <div class="feedback-box">
      {{ feedback|safe }}
    </div>
  {% endif %}
</div>

<script>
  // Mostrar nombre de archivo seleccionado
  const inputFile = document.getElementById('cvFile');
  const fileNameDiv = document.getElementById('fileName');

  inputFile.addEventListener('change', () => {
    if (inputFile.files.length > 0) {
      fileNameDiv.textContent = inputFile.files[0].name;
    } else {
      fileNameDiv.textContent = 'Ningún archivo seleccionado';
    }
  });
</script>
{% endblock %}
